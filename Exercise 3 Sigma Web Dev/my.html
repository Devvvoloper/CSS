<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My card</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

        body {
            background-color: #ebefef;
            font-family: 'poppins', sans-serif;
        }

        .cardbg {
            background-color: #fff;
            border: 1px solid grey;
            border-radius: 7px;
            box-shadow: 5px 1px 5px 1px grey;
            width: 30vw;
            margin: 20vw auto;
        }

        div.img > img{
            width: 29vw;
            border-radius: 20px;
        }

        .img {
            padding: 0.4vw;
            margin: 2px;
        }

        .tags > span{
            display: inline-block;
            color: grey;
            border: 1px solid grey;
            border-radius: 40px;
            padding: 3px 20px;
            margin-right: 1vw;
            white-space: nowrap;
            font-weight: 600;
            
        }

        .tags {
            margin-left: 1vw;
        }
        
        .h1 {
            font-weight: 550;
            margin: 2vw 1vw;
            margin-bottom: 1vw;
            white-space: nowrap;
            font-size: 3vw;
        }

        .para {
            color: grey;
            text-align: left;
            margin: 1vw 1vw;
            font-size: 2vw;
            line-height: 3vw;
        }
        
        .end {
            color: #348bf4;
            background-color: #c1d7ef;
            border: 1px solid white;
            border-radius: 20px;
            padding: 1vw 2vw;
            text-align: center;
            margin: 2vw 9vw 0.5vw 9vw;
            
            white-space: nowrap;
            font-size: 1.5vw;
            cursor: pointer;
        }

        .end:hover {
            background-color: #e6f2ff;
        }
        
    </style>
</head>

<body>
<div class="cardbg">
    <div class="img">
        <img src="C:\Users\devvv\Downloads\3126a8a700b72e1c38683c1940069be3.jpg" alt="Lake">
    </div>
    <div class="tags">
        <span>Nature</span>
        <span>Lake</span>
    </div>

    <div class="content">
        <h1 class="h1">Lago di Braies</h1>

        <p class="para">Lorem ipsum, dolor sit amet consectetur adipisicing elit. Adipisci ea dolor ipsum praesentium, quisquam id libero eveniet commodi earum odio voluptatibus voluptate doloremque!</p>
    </div>

    <button class="end">Read More</button>
</div>
</body>

</html>
