<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Layout Challenge</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');

        * {
            margin: 0;
            padding: 0;
        }

        nav {
            background-color: rgb(127, 127, 254);
            border-bottom: 2px solid black;
            position: sticky;
            top: 0px;
        }

        ul {
            list-style: none;
            display: flex;
            padding: 10px;
            justify-content: center;
            font-size: 20px;
        }

        li {
            margin: 10px 40px;
        }

        a {
            text-decoration: none;
            color: rgb(2, 2, 235);
            font-weight: 700;
        }

        body {
            font-family: 'poppins', 'roboto', sans-serif;
        }

        .bg {
            background-color: red;
            display: inline-block;
            border: 2px solid black;
            padding: 20px;
            margin-top: 10px;
            width: 94vw;
        }

        .sec1 {
            
            display: inline-block;
            padding: 0;

        }

        .s1 {
            background-color: aqua;
            display: inline-block;
            width: 45vw;
            height: 400px;
            border: 2px solid black;
            

        }
        .s2 {
            background-color: rgb(0, 255, 8);
            display: inline-block;
            width: 45vw;
            height: 400px;
            border: 2px solid black;
            margin-left: 20px;
            

        }

        .img {
            position: fixed;
            bottom: 0px;
            right: 0px;
            width: 50px;
        }

        .foot {
            border: 2px solid black;
            border-radius: 90px;
            background-color: bisque;
            display: inline-block;
            font-size: 50px;
            text-align: center;
            padding: 20px;
            margin-bottom: 200px;
        }

        .football{
            border: 2px solid black;
            background-color: chocolate;
            
        }

        footer {
            text-align: center;
            font-size: 40px;
        }
    </style>
</head>

<body>
    <nav>
        <div>
            <ul>
                <li><a href="/">Page 1</a></li>
                <li><a href="/">Page 2</a></li>
                <li><a href="/">Page 3</a></li>
                <li><a href="/">Page 4</a></li>
            </ul>
        </div>
    </nav>
    <main>
        <div class="bg">
            <section class="sec1">
                <div class="s1"></div>
                <div class="s2"></div>
            </section>
        </div>

        <div class="foot">Welcome to the Sigma Web Development Express</div>
    </main>

    <img src="https://img.icons8.com/?size=160&id=dxoYK8bxqiJr&format=png" alt="Logo" class="img">

    <footer>
        <div class="football">This is the footer</div>
    </footer>
</body>

</html>
